<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="PM Triage architecture: telemetry is detected by deterministic code, classified by physics rules and a narrow trained model, explained by a language model, then approved by a human planner before any CMMS work order is created.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9BA7B7"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2434" flood-opacity="0.07"/></filter></defs>
<rect x="0.0" y="0.0" width="1440.0" height="600.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" />
<text x="48.0" y="56.0" font-size="27" fill="#141821" font-weight="700">PM Triage</text>
<text x="48.0" y="84.0" font-size="14.5" fill="#606B7B" font-weight="400">How one abnormal sensor reading becomes an approved maintenance work order.</text>
<rect x="32.0" y="128.0" width="906.0" height="224.0" rx="18" fill="#F7F9FB" stroke="none" stroke-width="1.2" />
<rect x="958.0" y="128.0" width="450.0" height="224.0" rx="18" fill="#E7F6EF" stroke="none" stroke-width="1.2" />
<text x="48.0" y="154.0" font-size="10" fill="#8B95A5" font-weight="700" letter-spacing="1.6">MACHINE PROPOSES</text>
<text x="1392.0" y="154.0" font-size="10" fill="#07845C" font-weight="700" text-anchor="end" letter-spacing="1.6">HUMAN AUTHORIZES</text>
<path d="M 948.0 140 L 948.0 340" stroke="#07845C" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/>
<rect x="48.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="64.0" y="190.0" width="54.5" height="19.0" rx="9.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="73.0" y="202.9" font-size="9.5" fill="#64748B" font-weight="700" letter-spacing="0.9">SOURCE</text>
<text x="64.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Telemetry</text>
<text x="64.0" y="272.0" font-size="11.5" fill="#606B7B" font-weight="400">Eight simulated assets, plus real</text>
<text x="64.0" y="289.0" font-size="11.5" fill="#606B7B" font-weight="400">SKAB pump and CWRU bearing</text>
<text x="64.0" y="306.0" font-size="11.5" fill="#606B7B" font-weight="400">recordings replayed row by row.</text>
<rect x="277.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="293.0" y="190.0" width="97.0" height="19.0" rx="9.5" fill="#EEF3FE" stroke="none" stroke-width="1.2" />
<text x="302.0" y="202.9" font-size="9.5" fill="#2563EB" font-weight="700" letter-spacing="0.9">DETERMINISTIC</text>
<text x="293.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Detect</text>
<text x="293.0" y="272.0" font-size="11.5" fill="#606B7B" font-weight="400">Fixed engineering limits and a</text>
<text x="293.0" y="289.0" font-size="11.5" fill="#606B7B" font-weight="400">robust median/MAD excursion that</text>
<text x="293.0" y="306.0" font-size="11.5" fill="#606B7B" font-weight="400">must persist before it raises a case.</text>
<rect x="506.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="522.0" y="190.0" width="97.0" height="19.0" rx="9.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="531.0" y="202.9" font-size="9.5" fill="#64748B" font-weight="700" letter-spacing="0.9">RULES + MODEL</text>
<text x="522.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Classify</text>
<rect x="522.0" y="260.0" width="165.0" height="31.0" rx="8" fill="#EEF3FE" stroke="none" stroke-width="1.2" />
<rect x="522.0" y="260.0" width="3.5" height="31.0" rx="1.75" fill="#2563EB" stroke="none" stroke-width="1.2" />
<text x="534.0" y="274.0" font-size="11.5" fill="#2563EB" font-weight="700">Physics rules</text>
<text x="534.0" y="286.0" font-size="10" fill="#606B7B" font-weight="400">own every clear fault</text>
<rect x="522.0" y="296.0" width="165.0" height="31.0" rx="8" fill="#F5EFFE" stroke="none" stroke-width="1.2" />
<rect x="522.0" y="296.0" width="3.5" height="31.0" rx="1.75" fill="#7C3AED" stroke="none" stroke-width="1.2" />
<text x="534.0" y="310.0" font-size="11.5" fill="#7C3AED" font-weight="700">Trained model</text>
<text x="534.0" y="322.0" font-size="10" fill="#606B7B" font-weight="400">owns one overlapping pair</text>
<rect x="735.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="751.0" y="190.0" width="103.1" height="19.0" rx="9.5" fill="#FDF3E3" stroke="none" stroke-width="1.2" />
<text x="760.0" y="202.9" font-size="9.5" fill="#C2710A" font-weight="700" letter-spacing="0.9">LANGUAGE MODEL</text>
<text x="751.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Explain</text>
<text x="751.0" y="272.0" font-size="11.5" fill="#606B7B" font-weight="400">Writes the case: evidence, cited</text>
<text x="751.0" y="289.0" font-size="11.5" fill="#606B7B" font-weight="400">past work orders, recommended</text>
<text x="751.0" y="306.0" font-size="11.5" fill="#606B7B" font-weight="400">actions, a drafted work order.</text>
<rect x="964.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="980.0" y="190.0" width="48.4" height="19.0" rx="9.5" fill="#E7F6EF" stroke="none" stroke-width="1.2" />
<text x="989.0" y="202.9" font-size="9.5" fill="#07845C" font-weight="700" letter-spacing="0.9">HUMAN</text>
<text x="980.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Decide</text>
<text x="980.0" y="272.0" font-size="11.5" fill="#606B7B" font-weight="400">A named planner approves, edits</text>
<text x="980.0" y="289.0" font-size="11.5" fill="#606B7B" font-weight="400">or rejects. Priority P1–P4 comes</text>
<text x="980.0" y="306.0" font-size="11.5" fill="#606B7B" font-weight="400">from a formula, not from a model.</text>
<rect x="1193.0" y="172.0" width="197.0" height="164.0" rx="14" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" filter="url(#sh)"/>
<rect x="1209.0" y="190.0" width="115.2" height="19.0" rx="9.5" fill="#E7F6EF" stroke="none" stroke-width="1.2" />
<text x="1218.0" y="202.9" font-size="9.5" fill="#07845C" font-weight="700" letter-spacing="0.9">SYSTEM OF RECORD</text>
<text x="1209.0" y="246.0" font-size="17" fill="#141821" font-weight="700">Act</text>
<text x="1209.0" y="272.0" font-size="11.5" fill="#606B7B" font-weight="400">An idempotent work order lands</text>
<text x="1209.0" y="289.0" font-size="11.5" fill="#606B7B" font-weight="400">in the CMMS over HTTP, retried</text>
<text x="1209.0" y="306.0" font-size="11.5" fill="#606B7B" font-weight="400">on failure, never duplicated.</text>
<path d="M 252.0 254.0 L 270.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<path d="M 481.0 254.0 L 499.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<path d="M 710.0 254.0 L 728.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<path d="M 939.0 254.0 L 932.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<path d="M 964.0 254.0 L 957.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<path d="M 1168.0 254.0 L 1186.0 254.0" stroke="#9BA7B7" stroke-width="1.7" marker-end="url(#ah)" fill="none"/>
<circle cx="948.0" cy="254.0" r="14" fill="#FFFFFF" stroke="#07845C" stroke-width="1.6"/>
<rect x="943.0" y="253.0" width="10" height="8" rx="2" fill="#07845C"/>
<path d="M 945.0 253.0 v -2.5 a 3 3 0 0 1 6 0 v 2.5" stroke="#07845C" stroke-width="1.5" fill="none"/>
<rect x="48.0" y="386.0" width="432.0" height="44.0" rx="11" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" />
<circle cx="68.0" cy="408.0" r="4.5" fill="#2563EB"/>
<text x="84.0" y="406.0" font-size="12.5" fill="#141821" font-weight="600">It abstains below 0.45 confidence</text>
<text x="84.0" y="421.0" font-size="12.5" fill="#606B7B" font-weight="400">instead of guessing</text>
<rect x="504.0" y="386.0" width="432.0" height="44.0" rx="11" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" />
<circle cx="524.0" cy="408.0" r="4.5" fill="#C2710A"/>
<text x="540.0" y="406.0" font-size="12.5" fill="#141821" font-weight="600">The model never sets the fault class,</text>
<text x="540.0" y="421.0" font-size="12.5" fill="#606B7B" font-weight="400">the priority or the work order</text>
<rect x="960.0" y="386.0" width="432.0" height="44.0" rx="11" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1.1" />
<circle cx="980.0" cy="408.0" r="4.5" fill="#07845C"/>
<text x="996.0" y="406.0" font-size="12.5" fill="#141821" font-weight="600">No work order exists without</text>
<text x="996.0" y="421.0" font-size="12.5" fill="#606B7B" font-weight="400">a named human approval</text>
<rect x="48.0" y="456.0" width="1344.0" height="42.0" rx="11" fill="#FBFCFD" stroke="#E2E7EE" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="720.0" y="482.0" font-size="12.5" fill="#606B7B" font-weight="400" text-anchor="middle">Append-only audit  ·  every detection, every model call, every decision, with its actor and timestamp</text>
<text x="48.0" y="553.0" font-size="9.5" fill="#8B95A5" font-weight="700" letter-spacing="1.5">RUNS ON</text>
<rect x="112.7" y="540.0" width="117.9" height="25.0" rx="12.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="123.7" y="556.5" font-size="11" fill="#606B7B" font-weight="700">Next.js · Vercel</text>
<rect x="240.7" y="540.0" width="117.9" height="25.0" rx="12.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="251.7" y="556.5" font-size="11" fill="#606B7B" font-weight="700">FastAPI · Render</text>
<rect x="368.6" y="540.0" width="123.9" height="25.0" rx="12.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="379.6" y="556.5" font-size="11" fill="#606B7B" font-weight="700">Supabase Postgres</text>
<rect x="502.5" y="540.0" width="177.9" height="25.0" rx="12.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="513.5" y="556.5" font-size="11" fill="#606B7B" font-weight="700">CMMS as a separate service</text>
<rect x="690.4" y="540.0" width="231.8" height="25.0" rx="12.5" fill="#F1F4F8" stroke="none" stroke-width="1.2" />
<text x="701.4" y="556.5" font-size="11" fill="#606B7B" font-weight="700">OpenRouter · capped, off by default</text>
<text x="1392.0" y="557.0" font-size="11" fill="#8B95A5" font-weight="400" text-anchor="end">Detail: docs/ARCHITECTURE.md</text>
</svg>
